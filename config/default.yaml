# Default configuration for the fraud-detection pipeline.
seed: 42
artifacts_dir: artifacts

data:
  raw_csv: data/creditcard.csv
  openml_name: creditcard
  openml_version: 1

split:
  test_size: 0.2     # fraction of the full dataset held out as the final test set
  val_size: 0.2      # fraction of the full dataset used for calibration + threshold

features:
  scale_columns: ["Amount"]   # only Amount needs scaling; V1..V28 are PCA components

cost:
  c_fn: 100.0        # cost of a missed fraud
  c_fp: 1.0          # cost of a false alarm

threshold:
  grid_points: 200
  grid_low: 0.001
  grid_high: 0.999

bootstrap:
  n_resamples: 1000
  ci: 0.95

calibration:
  method: isotonic   # "isotonic" or "sigmoid"

tuning:
  enabled: true
  n_iter: 20
  cv_folds: 3

models:
  logreg:
    max_iter: 1000
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.9
  lightgbm:
    # No scale_pos_weight: LightGBM ranks best with default weighting on this data
    # (heavy positive weighting collapses its precision). Row bagging (subsample) is left
    # off because, with only ~315 frauds in training, it starves trees of positives and
    # destabilises ranking; more trees + a low learning rate + column subsampling is stable.
    n_estimators: 800
    num_leaves: 31
    learning_rate: 0.03
    colsample_bytree: 0.9
    min_child_samples: 20
  isolation_forest:
    n_estimators: 200
